services:
  - type: web
    name: adanalyse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_ANALYZE_MODEL
        value: claude-sonnet-4-5
      - key: ANTHROPIC_GENERATE_MODEL
        value: claude-sonnet-4-5
    disk:
      name: adanalyse-storage
      mountPath: /app/storage
      sizeGB: 1
